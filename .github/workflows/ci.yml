name: CI

on:
  push:
    branches: [ "main", "lab-2" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi make gcc lcov

      - name: Build Firmware
        run: make -C firmware all

      - name: Run Tests, Dependency Check and Coverage
        run: make -C tests all